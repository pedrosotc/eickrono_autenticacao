spring:
  config:
    activate:
      on-profile: stg
  datasource:
    url: jdbc:postgresql://banco-postgres:5432/eickrono_identidade_stg
    username: eickrono_stg
    password: senhaSuperSeguraStg
  flyway:
    schemas: identidade_stg
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://oidc-stg.eickrono.store/realms/eickrono
          jwk-set-uri: https://oidc-stg.eickrono.store/realms/eickrono/protocol/openid-connect/certs

seguranca:
  mtls:
    habilitado: true
    keystore-arquivo: classpath:certificados/stg-servidor.p12
    keystore-senha: senhaCertificadoStg
    truststore-arquivo: classpath:certificados/stg-truststore.p12
    truststore-senha: senhaTruststoreStg
  cors:
    origens-permitidas:
      - https://stg-app.eickrono.com.br

documentacao:
  swagger:
    usuario: swagger
    senha: Sw9@Qm2!Tx7#Lp4$Vz8Kr
    ips-permitidos:
      - 10.0.0.10
      - 10.0.0.11

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.eickrono.api.identidade: INFO

identidade:
  seguranca:
    app:
      modo-observacao: true
  atestacao:
    app:
      permitir-validacao-local-sem-provedor-oficial: ${IDENTIDADE_ATESTACAO_APP_PERMITIR_VALIDACAO_LOCAL_SEM_PROVEDOR_OFICIAL:true}
      google:
        habilitado: ${IDENTIDADE_ATESTACAO_APP_GOOGLE_HABILITADO:false}
      apple:
        habilitado: ${IDENTIDADE_ATESTACAO_APP_APPLE_HABILITADO:false}
  cadastro:
    interna:
      keycloak:
        url-base: ${IDENTIDADE_CADASTRO_INTERNO_KEYCLOAK_URL_BASE:http://localhost:18080}
        realm: ${IDENTIDADE_CADASTRO_INTERNO_KEYCLOAK_REALM:eickrono}
  sessao:
    interna:
      keycloak:
        url-base: ${IDENTIDADE_SESSAO_INTERNA_KEYCLOAK_URL_BASE:http://localhost:18080}
        realm: ${IDENTIDADE_SESSAO_INTERNA_KEYCLOAK_REALM:eickrono}
        client-id: ${IDENTIDADE_SESSAO_INTERNA_KEYCLOAK_CLIENT_ID:app-flutter-stg}
        scope: ${IDENTIDADE_SESSAO_INTERNA_KEYCLOAK_SCOPE:openid identidade:ler vinculos:ler vinculos:escrever offline_access}
        token-exchange-client-id: ${IDENTIDADE_SESSAO_INTERNA_KEYCLOAK_TOKEN_EXCHANGE_CLIENT_ID:eickrono-autenticacao-interno}
        token-exchange-client-secret: ${IDENTIDADE_SESSAO_INTERNA_KEYCLOAK_TOKEN_EXCHANGE_CLIENT_SECRET:${INTEGRACAO_PERFIL_JWT_INTERNO_CLIENT_SECRET:}}
        token-exchange-audience: ${IDENTIDADE_SESSAO_INTERNA_KEYCLOAK_TOKEN_EXCHANGE_AUDIENCE:app-flutter-stg}
        token-exchange-scope: ${IDENTIDADE_SESSAO_INTERNA_KEYCLOAK_TOKEN_EXCHANGE_SCOPE:openid identidade:ler vinculos:ler vinculos:escrever offline_access}
  social:
    credenciais:
      apple:
        audiences: ${IDENTIDADE_SOCIAL_CREDENCIAIS_APPLE_AUDIENCES:com.eickrono.thimisu}
  dispositivo:
    token:
      segredo-hmac: ${IDENTIDADE_DEVICE_TOKEN_SECRET}
    codigo:
      segredo-hmac: ${IDENTIDADE_CODIGO_TOKEN_SECRET}
